# Parámetros del equipo (reglamento §9.1).
#
# Acá solo van valores GENERALES: umbrales, ganancias, límites de velocidad,
# rangos de color. Nada que dependa del mapa de la competencia: nada de
# coordenadas, rutas ni posiciones de víctimas. El CI (tools/verificar_params.py)
# rechaza estos archivos si rompen la regla.
#
# Una sección por nodo. Los nombres no pueden contener victim, coord, spawn ni
# posicion_ (docs/team/INTERFACES.md).
cobertura:
  ros__parameters: {}
deteccion:
  ros__parameters: {}
fusion:
  ros__parameters: {}
mision:
  ros__parameters: 
    min_observaciones: 5
    max_desvio_m: 0.10
    distancia_min_reportes_m: 0.40
    distancia_mismo_punto_m: 0.30
    angulo_mismo_punto_rad: 0.5
